##########################################
###### local-host-arch live profile ######
##########################################
#
# Minimal i3 desktop (rofi launcher, Falkon browser, Docker) on top of
# a console Manjaro live system.

# Show LightDM's login screen; the live user is manjaro/manjaro.
displaymanager="lightdm"
autologin="false"

# Boot loader used by the generated ISO.
efi_boot_loader="grub"

multilib="false"
nonfree_mhwd="false"

# Enabled in the live session and in an installed system.
# load_profile_config adds "lightdm" automatically for the displaymanager.
enable_systemd=('docker' 'NetworkManager' 'cronie')

# Live-only services: the stock Manjaro live services plus ours. The
# compose service starts /etc/local-host/docker-compose.yaml and keeps it up.
enable_systemd_live=('manjaro-live' 'mhwd-live' 'pacman-init' 'mirrors-live' 'live-machine-id' 'local-host-compose')

# Boot straight into the desktop; systemd-firstboot is also disabled here
# as a fallback in case the machine-id service ever fails. The larger
# overlay gives Docker's image pulls room in the ram-backed live root.
custom_boot_args=('systemd.firstboot=no' 'overlay_root_size=90%')

################# livecd #################

hostname="local-host"
username="manjaro"
password="manjaro"

# defaults to bash
login_shell="/bin/bash"

# docker: the live user may talk to the daemon without sudo.
# The docker group comes from the docker package (Packages-Desktop).
addgroups="lp,network,power,sys,wheel,docker"
