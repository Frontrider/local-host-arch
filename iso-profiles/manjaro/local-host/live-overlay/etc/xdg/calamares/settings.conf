---
modules-search: [ local ]

instances:
    - id: local-partition
      module: packagechooserq
      config: local-partition.conf
    - id: data
      module: packagechooserq
      config: data-device.conf
    - id: data-confirm
      module: packagechooserq
      config: data-confirm.conf
    - id: backup-secondary
      module: packagechooserq
      config: backup-secondary.conf
sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - packagechooserq@local-partition
        - packagechooserq@data
        - packagechooserq@data-confirm
        - packagechooserq@backup-secondary
        - users
        - summary
    - exec:
        # Partition and format only after Summary has been accepted.
        - local-host-setup-storage
        - mount
        - unpackfs
        - networkcfg
        - machineid
        - locale
        - keyboard
        - localecfg
        - luksbootkeyfile
        - luksopenswaphookcfg
        - fstab
        - data-fstab
        - local-host-setup-secondary-backup
        - initcpiocfg
        - initcpio
        - users
        - displaymanager
        - mhwdcfg
        - hwclock
        - services
        # No-op compatibility module: stock bootloader requires a loaded
        # module named "partition" before it.
        - partition
        - grubcfg
        - bootloader
        - postcfg
        - umount
    - show:
        - finished
branding: manjaro

prompt-install: true

dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
