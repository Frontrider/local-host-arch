[Unit]
# Docker does not need to wait for "network is online" in the live image.
# Reset the dependency lists and re-add everything except
# network-online.target; the compose supervisor retries until networking
# and image pulls succeed.
After=
After=network.target nss-lookup.target docker.socket firewalld.service containerd.service time-set.target
Wants=
Wants=containerd.service
