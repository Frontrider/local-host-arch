# Third-party XLibre packages for the desktop image.
#
# manjaro-tools appends this file to the build chroot's pacman.conf. The
# repository is signed with D1445F51BC0A8969 (xlibre-manjarolinux.asc), but a
# fresh manjaro-tools chroot has no hook for importing third-party keys before
# basestrap runs, so signature checking is disabled for this repository. The
# packages are still fetched over HTTPS.
[xlibre]
SigLevel = Never
Server = https://xlibre-manjaro.github.io/$arch
