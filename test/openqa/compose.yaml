services:
  openqa:
    build:
      context: .
      args:
        BASE_IMAGE: ${OPENQA_BASE_IMAGE:-registry.opensuse.org/devel/openqa/containers/openqa-single-instance}
    image: ${OPENQA_IMAGE:-local-host-openqa:latest}
    container_name: ${OPENQA_NAME:-local-host-openqa}
    ports:
      - "${OPENQA_HTTP_PORT:-1080}:80"
      - "${OPENQA_HTTPS_PORT:-1443}:443"
    devices:
      - /dev/kvm
    volumes:
      # Jobs, results, screenshots and the ISO/HDD assets.
      - openqa-data:/var/lib/openqa
      # PostgreSQL cluster and therefore the openQA database.
      - openqa-pg:/var/lib/pgsql
      # The test distribution and needles come straight from the repository,
      # so an edited module or a new needle needs no copy or restart.
      - ${OPENQA_DISTRI_DIR:-../openqa-distri}:/var/lib/openqa/share/tests/local-host
      # All ISOs for the current base Manjaro image, flat under the names
      # openQA expects. Keep the version in sync with openqa.sh.
      - ../../out/manjaro/local-host/26.1.3:/var/lib/openqa/share/factory/iso:ro

  webdav:
    image: rclone/rclone:1.74.2
    # QEMU user networking maps 10.0.2.2 in the guest to the worker's loopback.
    # No port is published, and the credentials are only for this test server.
    network_mode: "service:openqa"
    command:
      - serve
      - webdav
      - /srv/webdav
      - --addr
      - "127.0.0.1:8081"
      - --user
      - openqa
      - --pass
      - openqa-test
    tmpfs:
      - /srv/webdav

volumes:
  openqa-data:
    name: ${OPENQA_DATA_VOLUME:-local-host-openqa-data}
  openqa-pg:
    name: ${OPENQA_PG_VOLUME:-local-host-openqa-pg}
