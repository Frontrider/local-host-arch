<!doctype html>
<meta charset="utf-8">
<title>fixture sizes</title>
<img id="a" src="language.png">
<img id="b" src="system-drive.png">
<img id="c" src="blank-desktop.png">
<pre id="out"></pre>
<script>
  const ids = ['a', 'b', 'c'];
  Promise.all(ids.map((id) => new Promise((res) => {
    const i = document.getElementById(id);
    if (i.complete) res();
    else i.onload = i.onerror = res;
  }))).then(() => {
    document.getElementById('out').textContent = ids.map((id) => {
      const i = document.getElementById(id);
      return id + ' ' + i.naturalWidth + 'x' + i.naturalHeight;
    }).join('\n');
  });
</script>
