# GitLab CI: build the Manjaro live ISO and publish it as a Release asset.
#
# Runner requirements (see README):
#   * a runner tagged with $ISO_RUNNER_TAG (default: iso-builder)
#   * Docker executor with privileged = true (buildiso creates and mounts
#     chroots), or a shell runner on a Manjaro host with root/sudo
#   * >= 15 GiB free disk, network access to Manjaro mirrors and ghcr.io
#
# The ISO is uploaded to the project's Generic Package Registry and linked
# from a GitLab Release on tag pipelines. It is intentionally NOT stored as
# a job artifact: it is larger than the default artifact limit.

stages:
  - build
  - release

variables:
  ISO_BUILD_IMAGE: "manjarolinux/base:latest"
  ISO_RUNNER_TAG: "iso-builder"
  ISO_PACKAGE: "local-host-arch"
  KERNEL: "linux618"
  BUILD_MIRROR: "https://mirrors.manjaro.org/repo"
  GIT_DEPTH: "0"

.install_build_deps: &install_build_deps
  - |
    set -euo pipefail
    if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi
    need=0
    for c in buildiso xorriso mktorrent kwalify mkfs.fat mksquashfs \
             grub-mkimage grub-editenv perl rsync openssl git curl \
             pacman pacman-mirrors; do
      command -v "$c" >/dev/null 2>&1 || need=1
    done
    if [ "$need" -eq 1 ]; then
      if command -v pacman-mirrors >/dev/null 2>&1; then
        $SUDO pacman-mirrors --fasttrack 5 || true
      fi
      $SUDO pacman -Syu --noconfirm --needed \
        manjaro-tools-iso-git manjaro-tools-base-git manjaro-tools-yaml-git \
        manjaro-iso-profiles-base libisoburn mktorrent \
        calamares-tools ruby-kwalify squashfs-tools dosfstools grub \
        mkinitcpio pacman-mirrors rsync openssl perl git curl || {
          $SUDO pacman-key --init
          $SUDO pacman-key --populate manjaro archlinux
          $SUDO pacman -Syu --noconfirm --needed \
            manjaro-tools-iso-git manjaro-tools-base-git manjaro-tools-yaml-git \
            manjaro-iso-profiles-base libisoburn mktorrent \
            calamares-tools ruby-kwalify squashfs-tools dosfstools grub \
            mkinitcpio pacman-mirrors rsync openssl perl git curl
        }
    fi

.build_and_publish: &build_and_publish
  - |
    set -euo pipefail
    ./build.sh --no-check --kernel "$KERNEL" --mirror "$BUILD_MIRROR"

    ISO=$(find out -type f -name '*.iso' -printf '%T@ %p\n' \
      | sort -n | tail -1 | cut -d' ' -f2-)
    [ -n "$ISO" ] || { echo "build produced no ISO" >&2; exit 1; }

    # Tag pipelines use the tag, others use branch + commit.
    VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}}"
    VERSION=$(printf '%s' "$VERSION" | tr '/' '-')
    RELEASE_ISO="${ISO_PACKAGE}-${VERSION}.iso"
    BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${ISO_PACKAGE}/${VERSION}"

    HASH=$(sha256sum "$ISO" | cut -d' ' -f1)
    printf '%s  %s\n' "$HASH" "$RELEASE_ISO" > out/SHA256SUMS

    echo "Uploading $(du -h "$ISO" | cut -f1) ISO to $BASE/$RELEASE_ISO"
    curl --fail --silent --show-error \
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --upload-file "$ISO" "$BASE/$RELEASE_ISO"
    curl --fail --silent --show-error \
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --upload-file out/SHA256SUMS "$BASE/SHA256SUMS"

    echo "Package URL: $BASE/$RELEASE_ISO"

.iso_job:
  image:
    name: "$ISO_BUILD_IMAGE"
    entrypoint: [""]
  tags:
    - "$ISO_RUNNER_TAG"
  timeout: 2h
  interruptible: true
  resource_group: iso-build
  privileged: true
  before_script: *install_build_deps

build-iso:
  extends: .iso_job
  stage: build
  script: *build_and_publish
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - out/SHA256SUMS
      - work/logs/*.log

release-iso:
  extends: .iso_job
  stage: release
  interruptible: false
  script: *build_and_publish
  rules:
    # Keep tags URL-safe for the package path and release asset links.
    - if: '$CI_COMMIT_TAG =~ /^[0-9A-Za-z._-]+$/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - out/SHA256SUMS
      - work/logs/*.log
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "local-host-arch $CI_COMMIT_TAG"
    description: |
      Manjaro live ISO built from commit `$CI_COMMIT_SHA`.
      Kernel: `$KERNEL`
      Pipeline: $CI_PIPELINE_URL
    assets:
      links:
        - name: "local-host-arch $CI_COMMIT_TAG ISO"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${ISO_PACKAGE}/${CI_COMMIT_TAG}/${ISO_PACKAGE}-${CI_COMMIT_TAG}.iso"
          link_type: package
        - name: "SHA256SUMS"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${ISO_PACKAGE}/${CI_COMMIT_TAG}/SHA256SUMS"
          link_type: package
