name: Build and publish ISO

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish as this release tag, vMAJOR.MINOR.PATCH (empty = artifact only)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The checks that need no ISO run on their own runner, in parallel with the
  # build, so a broken script or QML page is reported long before the ISO is
  # ready.
  checks-no-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checks that need no ISO
        run: bash test/run-docker.sh --static

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH (got '$TAG')"
            exit 1
          fi
          echo "Release tag: $TAG"

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /opt/az \
            /usr/lib/google-cloud-sdk \
            /usr/local/lib/node_modules \
            /usr/local/go \
            /usr/share/swift \
            /usr/lib/jvm
          sudo apt-get clean
          docker system prune -af || true
          df -h /

      - name: Build ISO (Manjaro container)
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            manjarolinux/base:latest \
            bash -euxo pipefail -c '
              pacman-mirrors --fasttrack 5 || true

              pacman -Syu --noconfirm || {
                pacman-key --init
                pacman-key --populate manjaro archlinux
                pacman -Syu --noconfirm
              }

              pacman -S --noconfirm --needed \
                manjaro-tools-iso-git \
                manjaro-tools-base-git \
                manjaro-tools-yaml-git \
                manjaro-iso-profiles-base \
                libisoburn \
                mktorrent \
                calamares-tools \
                ruby-kwalify \
                git \
                squashfs-tools \
                dosfstools \
                grub \
                mkinitcpio

              ./build.sh --no-check
            '
          sudo chown -R "$(id -u):$(id -g)" out work/logs 2>/dev/null || true

      - name: Verify ISO
        timeout-minutes: 45
        run: |
          set -euo pipefail
          # Builds always start from scratch, so the chroots are not reused.
          # Removing them frees the space needed to unpack the live filesystem.
          sudo rm -rf work/chroots
          df -h /
          bash test/run-docker.sh
          df -h /

      - name: Collect ISO and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          iso=$(find out -type f -name '*.iso' -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
          test -n "$iso"
          cp -- "$iso" dist/
          (cd dist && sha256sum -- *.iso > SHA256SUMS)
          ls -lh dist
          df -h /

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-host-arch-iso-${{ github.run_number }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: work/logs
          if-no-files-found: ignore
          retention-days: 7

  # Publishing waits for both jobs, so a release is never created while the
  # no-ISO checks are still failing.
  publish:
    needs: [checks-no-iso, build]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: local-host-arch-iso-${{ github.run_number }}
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
